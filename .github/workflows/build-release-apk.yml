name: Build signed release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the git commit count

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KITSUNE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KITSUNE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kitsune-release.jks"

      - name: Build signed release APK
        env:
          KITSUNE_KEYSTORE_FILE: ${{ runner.temp }}/kitsune-release.jks
          KITSUNE_KEYSTORE_PASSWORD: ${{ secrets.KITSUNE_KEYSTORE_PASSWORD }}
          KITSUNE_KEY_ALIAS: ${{ secrets.KITSUNE_KEY_ALIAS }}
          KITSUNE_KEY_PASSWORD: ${{ secrets.KITSUNE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/Kitsune_*-release.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitsune-release
          path: app/build/outputs/apk/release/Kitsune_*-release.apk

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Kitsune_*-release.apk

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kitsune-release.jks"
